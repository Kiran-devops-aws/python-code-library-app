version: '3.8'

services:
  db:
    image: kiran84/flm2026:dbimage
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: kiran84/flm2026:authimage
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: kiran84/flm2026:bookimage
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: kiran84/flm2026:borrowimage
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: kiran84/flm2026:appimage
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
    attachable: true
