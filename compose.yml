version: '3.8'

services:
  db:
    image: kiran84/flm2027:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: kiran84/flm2027:auth
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: kiran84/flm2027:book
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: kiran84/flm2027:borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: kiran84/flm2027:frontend
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: bridge
